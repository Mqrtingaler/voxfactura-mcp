[project]
name = "voxfactura-mcp"
version = "0.2.1"
description = "Serveur MCP VoxFactura : branche ton business (factures, dépenses, chantiers, marge, TVA) sur ton assistant IA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VoxFactura" }]
keywords = ["mcp", "voxfactura", "facturation", "artisan", "claude"]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    # cryptography est tiré par mcp (pyjwt[crypto]). Les versions >=45 ne
    # publient plus de wheel macOS Intel -> compilation Rust/OpenSSL chez les
    # utilisateurs Intel. On borne à <45 (wheels partout : Intel-mac, arm64,
    # Linux, Windows) pour une install sans compilateur.
    "cryptography>=42,<45",
]

[project.scripts]
voxfactura-mcp = "voxfactura_mcp.server:main"

[project.urls]
Homepage = "https://voxfactura.com"
Documentation = "https://voxfacture-production.up.railway.app/api/v1/pub/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voxfactura_mcp"]
