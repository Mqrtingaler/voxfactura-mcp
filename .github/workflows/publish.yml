name: publish

# Publie sur PyPI automatiquement quand tu crées une Release GitHub.
# Auth via Trusted Publishing (OIDC) : aucun token stocké.
# Prérequis (une seule fois) : sur https://pypi.org/manage/account/publishing/
# ajouter un publisher -> Project: voxfactura-mcp, Owner: Mqrtingaler,
# Repository: voxfactura-mcp, Workflow: publish.yml, Environment: (vide).

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # requis pour le Trusted Publishing PyPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
